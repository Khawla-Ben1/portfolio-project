{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Login</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p class="login-link">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
